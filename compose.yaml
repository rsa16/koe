services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-koe}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-koe}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/migrate.js"]
    working_dir: /app/packages/db
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/koe}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/koe}
      PORT: ${PORT:-3000}
      HOST: ${HOST:-0.0.0.0}
      REACTION_ALLOWLIST: ${REACTION_ALLOWLIST:-}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-}
      RATE_LIMIT_COMMENTS: ${RATE_LIMIT_COMMENTS:-}
      RATE_LIMIT_VOTES: ${RATE_LIMIT_VOTES:-}
      RATE_LIMIT_REACTIONS: ${RATE_LIMIT_REACTIONS:-}
      DUPLICATE_COMMENT_WINDOW_MS: ${DUPLICATE_COMMENT_WINDOW_MS:-}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
