services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-koe}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-koe}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run build && cd packages/db && node dist/migrate.js && cd /app && npm run dev"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/koe}
      PORT: ${PORT:-3000}
      HOST: ${HOST:-0.0.0.0}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - node_modules_dev:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata_dev:
  node_modules_dev:
